<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <h1>Formulario de Nombres</h1>
    <form method="POST">
        <label>Nombre 1:</label>
        <input type="text" name="nombre1" required>
        <br><br>
        <label>Nombre 2:</label>
        <input type="text" name="nombre2" required>
        <br><br>
        <label>Nombre 3:</label>
        <input type="text" name="nombre3" required>
        <br><br>
        <button type="submit">Enviar</button>
    </form>
    {% if nombre_mayor %}
        <h2>Nombre con más caracteres:
            {{ nombre_mayor }}</h2>
        <h2>Cantidad de caracteres:
            {{ cantidad }}</h2>
    {% endif %}
    <br>
    <a href="/">Volver al menú principal</a>
</body>
</html>
